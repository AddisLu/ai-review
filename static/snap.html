<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1">
<title>用手機拍考卷・AI 總複習</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="snappage">
<main class="snap" id="root">
  <h1>拍考卷傳到電腦</h1>
  <p class="sub">一頁拍一張，拍好的照片會馬上出現在電腦上。</p>
  <label class="btn lg block snapbtn"><input type="file" accept="image/*" capture="environment" id="cam" hidden><span id="camlabel">拍第 1 頁</span></label>
  <label class="btn ghost block"><input type="file" accept="image/*,.heic,.heif" multiple id="pick" hidden>從相簿選（可以選很多張）</label>
  <div class="thumbs" id="thumbs"></div>
  <button class="btn ok lg block hidden" id="done">完成，開始整理</button>
  <p class="small muted" id="link"><span class="dot"></span>連線中…</p>
</main>
<div id="toasts"></div>
<div id="modal-root"></div>
<script type="module" src="/static/js/snappage.js"></script>
</body>
</html>
